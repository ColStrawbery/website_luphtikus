<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="styles.css">
    <title></title>
  </head>

  <body>
    <div class="main_container">
        <div class="pixel_container">
            <canvas id="gameCanvas" class="game-canvas"></canvas>
        </div>

        <div class="overlay">
            <div class="overlay_content">
                <h1 class="overlay_header_text">
                    STEAR CLEAR<br>OF THE SUN<br>
                </h1>
                <p class="overlay_text">
                    Sleep during the day<br>
                    and a good nights work<br>
                    are the key to victory!<br>
                </p>
            </div>
        </div>

        <div>
            <img class="overlay_image" src="sLogoREAL.png" alt="overlay image">
        </div>

<script>
// https://www.geeksforgeeks.org/javascript/conways-game-of-life-in-javascript/

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = canvas.parentElement;

const cellSize = 2;
let numRows, numCols;

const maxAge = 25; // generations a cell can live before decaying

function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = container.getBoundingClientRect();

    numCols = Math.floor((rect.width * dpr) / cellSize);
    numRows = Math.floor((rect.height * dpr) / cellSize);

    // internal resolution = grid size
    canvas.width = numCols;
    canvas.height = numRows;

    // display size = exact whole-pixel multiple of the grid
    canvas.style.width = (numCols * cellSize) / dpr + 'px';
    canvas.style.height = (numRows * cellSize) / dpr + 'px';
}

resizeCanvas();

function createGrid() {
    const grid = [];
    for (let i = 0; i < numRows; i++) {
        grid[i] = [];
        for (let j = 0; j < numCols; j++) {
            grid[i][j] = Math.random() > 0.7 ? 1 : 0;
        }
    }
    return grid;
}

function createAges() {
    const a = [];
    for (let i = 0; i < numRows; i++) {
        a[i] = [];
        for (let j = 0; j < numCols; j++) {
            a[i][j] = Math.floor(Math.random() * maxAge);
        }
    }
    return a;
}

let grid = createGrid();
let ages = createAges();
let animationId = null;

function drawGrid() {
    const img = ctx.createImageData(numCols, numRows);
    const d = img.data;
    for (let i = 0; i < numRows; i++) {
        for (let j = 0; j < numCols; j++) {
            if (grid[i][j] === 1) {
                const p = (i * numCols + j) * 4;
                const youth = 1 - ages[i][j] / maxAge;

                d[p] = 162 * youth;
                d[p + 1] = 156  * youth;
                d[p + 2] = 252 * youth;
                d[p + 3] = 255;
            }
        }
    }
    ctx.putImageData(img, 0, 0);
}

function updateGrid() {
    const newGrid = [];
    const newAges = [];
    const newDensity = [];
    for (let i = 0; i < numRows; i++) {
        newGrid[i] = [];
        newAges[i] = [];
        for (let j = 0; j < numCols; j++) {
            const neighbors = countNeighbors(i, j);
            const alive = grid[i][j] === 1;
            let next;

            // your rules
            if (alive && (neighbors < 2 || neighbors > 3)) {
                next = 0;
            } else if (!alive && (neighbors === 3 || neighbors === 7)) {
                next = 1;
            } else {
                next = grid[i][j];
            }

            // age handling
            let age = 0;
            if (next === 1) {
                if (alive) {
                    age = ages[i][j] + 1;
                    if (age > maxAge) {
                        next = 0;
                        age = 0;
                    }
                }
            }

            newGrid[i][j] = next;
            newAges[i][j] = age;
        }
    }
    grid = newGrid;
    ages = newAges;
}

function countNeighbors(row, col) {
    let count = 0;
    for (let i = -1; i <= 1; i++) {
        for (let j = -1; j <= 1; j++) {
            const r = row + i;
            const c = col + j;
            if (r >= 0 && r < numRows && c >= 0 &&
                c < numCols && !(i === 0 && j === 0)) {
                count += grid[r][c];
            }
        }
    }
    return count;
}

let lastTime = 0;
const stepDelay = 1000/(32 / 2);

function mainLoop(timestamp) {
    if (timestamp - lastTime >= stepDelay) {
        updateGrid();
        drawGrid();
        lastTime = timestamp;
    }
    animationId = requestAnimationFrame(mainLoop);
}

requestAnimationFrame(mainLoop);
</script>
  </body>
</html>
